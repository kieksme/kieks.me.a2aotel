<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A2A und OpenTelemetry: Rechte verhindern, Tracing belegt</title>
    <meta
      name="description"
      content="Simulation: Zwei KI-Agenten rufen sich auf. Ein Wrapper prüft die Berechtigung und schreibt jeden Aufruf in einen Trace."
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="skip">Zum Inhalt springen</a>

    <header class="site-header">
      <div class="header-row">
        <p class="eyebrow" data-i18n="hero.eyebrow">kieks.me · Beispielprojekt</p>
        <label class="lang-switch">
          <span data-i18n="lang.label">Sprache</span>
          <select id="lang-select"></select>
        </label>
      </div>
      <h1 data-i18n="hero.title">Rechte verhindern, Tracing belegt</h1>
      <p class="lead" data-i18n="hero.lead"></p>
    </header>

    <aside class="sim-banner" role="note" data-i18n-aria="sim.aria">
      <span class="sim-badge" data-i18n="sim.badge">Simulation</span>
      <p>
        <span data-i18n="sim.text"></span>
        <a href="https://github.com/kieksme/kieks.me.a2aotel" data-i18n="sim.link"></a>
      </p>
    </aside>

    <main id="main">
      <section class="panel controls" aria-labelledby="controls-title">
        <h2 id="controls-title" data-i18n="controls.title"></h2>
        <div class="messages" id="messages"></div>

        <div class="toolbar">
          <button type="button" class="switch" id="wrapper-switch" role="switch" aria-checked="true">
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            <span>
              <strong data-i18n="wrapper.label">Wrapper</strong>
              <span class="switch-state" id="wrapper-state"></span>
            </span>
          </button>

          <div class="view-tabs" role="tablist" data-i18n-aria="view.aria">
            <button type="button" role="tab" id="tab-visual" aria-controls="panel-visual" aria-selected="true" data-i18n="view.visual"></button>
            <button type="button" role="tab" id="tab-code" aria-controls="panel-code" aria-selected="false" tabindex="-1" data-i18n="view.code"></button>
          </div>

          <button type="button" class="button" id="replay" data-i18n="replay"></button>
        </div>
      </section>

      <div class="stage">
        <section class="panel" id="panel-visual" role="tabpanel" aria-labelledby="tab-visual">
          <h2 class="visually-hidden" data-i18n="visual.heading"></h2>
          <div class="flow-scroll" tabindex="0" role="region" data-i18n-aria="flow.scrollAria"><div id="flow"></div></div>
          <p class="hint scroll-hint" data-i18n="flow.scrollHint"></p>
          <p class="hint" data-i18n="flow.hint"></p>
          <div class="inspector" id="inspector" aria-live="polite"></div>
        </section>

        <section class="panel" id="panel-code" role="tabpanel" aria-labelledby="tab-code" hidden>
          <h2 class="visually-hidden" data-i18n="view.code"></h2>
          <div id="code"></div>
        </section>

        <section class="panel steps-panel" aria-labelledby="steps-title">
          <h2 id="steps-title" data-i18n="steps.title"></h2>
          <ol class="steps" id="steps" aria-live="polite"></ol>
          <div class="outcome" id="outcome" role="status"></div>
        </section>
      </div>

      <section class="panel" aria-labelledby="trace-title">
        <div class="panel-head">
          <h2 id="trace-title"><span data-i18n="trace.title"></span> <span class="mock-tag" data-i18n="trace.mock"></span></h2>
          <button type="button" class="button" id="download" data-i18n="trace.download"></button>
        </div>
        <p class="hint" data-i18n="trace.hint"></p>
        <div id="trace"></div>
      </section>

      <section class="panel auditor" aria-labelledby="auditor-title">
        <h2 id="auditor-title" data-i18n="auditor.title"></h2>
        <div id="auditor"></div>
      </section>

      <section class="panel" aria-labelledby="compare-title">
        <div class="panel-head">
          <h2 id="compare-title" data-i18n="compare.title"></h2>
          <button type="button" class="button" id="compare-play" data-i18n="compare.play"></button>
        </div>
        <p class="hint" data-i18n="compare.hint"></p>
        <div class="compare" id="compare"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        <span data-i18n="footer.text"></span>
        <a href="https://github.com/kieksme/kieks.me.a2aotel" data-i18n="footer.repo"></a> ·
        <span data-i18n="footer.license"></span>
      </p>
    </footer>

    <dialog id="card-dialog" aria-labelledby="card-title">
      <div class="dialog-head">
        <h2 id="card-title" data-i18n="card.title">Agent Card</h2>
        <button type="button" class="button" id="card-close" data-i18n="card.close"></button>
      </div>
      <p class="hint" id="card-intro"></p>
      <pre class="code-scroll shiki card-json" id="card-json" tabindex="0" data-i18n-aria="card.jsonAria"></pre>
      <p class="hint">
        <span data-i18n="card.note"></span>
        <span data-i18n="card.contentNote"></span>
        <button type="button" class="link-button" id="card-code" data-i18n="card.codeLink"></button>
      </p>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
